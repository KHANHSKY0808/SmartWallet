name: SmartWallet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-security:
    name: Build, Unit Tests, Gitleaks & E2E
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        run: |
          GITLEAKS_VER="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x ./gitleaks
          ./gitleaks detect --source . --no-git --verbose --redact
          rm -f gitleaks gitleaks.tar.gz

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & Build .NET Solution
        run: dotnet build SmartWallet.sln --nologo -c Release

      - name: Run .NET Unit & Integration Tests
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY || 'CI-TEST-ONLY-signing-key-must-be-at-least-32-chars' }}
        run: dotnet test SmartWallet.sln --nologo --no-build -c Release -v minimal

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Frontend Install, Vitest & Production Build
        working-directory: fe
        run: |
          npm install --no-audit --no-fund
          npx ng test --watch=false
          npm run build

      - name: Run E2E Suite when QA harness is checked out
        if: ${{ hashFiles('../qa/run_e2e.py') != '' }}
        env:
          QA_JWT_KEY: ${{ secrets.JWT_SIGNING_KEY || 'QA-E2E-TEST-ONLY-signing-key-do-not-use-0123456789' }}
        run: |
          dotnet build SmartWallet.sln --nologo -v q
          python3 ../qa/run_e2e.py --no-build

