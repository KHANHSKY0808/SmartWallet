<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; max-width: 100%; overflow-x: hidden; background-color: #f8fafc; color: #1e293b;">
  <header style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 0.9rem 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
      <a routerLink="/" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: white;">
        <span style="font-size: 1.75rem;">💳</span>
        <h1 style="margin: 0; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.025em;">SmartWallet SOA</h1>
      </a>

      <nav style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <ng-container *ngIf="!authService.isLoggedIn()">
          <a routerLink="/login" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px;">Đăng nhập</a>
          <a routerLink="/register" style="background: white; color: #1e3a8a; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.9rem; border-radius: 6px;">Đăng ký</a>
        </ng-container>

        <ng-container *ngIf="authService.isLoggedIn()">
          <a routerLink="/wallets" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>👛</span> Ví của tôi
          </a>
          <a routerLink="/transactions" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>💸</span> Giao dịch
          </a>
          <a routerLink="/categories" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>📁</span> Danh mục
          </a>
          <a routerLink="/budgets" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>🎯</span> Ngân sách
          </a>
          <a routerLink="/reports" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>📊</span> Báo cáo
          </a>
          <a *ngIf="authService.hasPermission('users.read')" routerLink="/admin/users" style="color: #fde047; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.7rem; border-radius: 4px; display: flex; align-items: center; gap: 0.35rem;">
            <span>👥</span> Users
          </a>
          <a *ngIf="authService.hasPermission('audit.read')" routerLink="/admin/audit" style="color: #fde047; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.7rem; border-radius: 4px; display: flex; align-items: center; gap: 0.35rem;">
            <span>📜</span> Audit
          </a>
          <a *ngIf="authService.hasPermission('health.read')" routerLink="/admin/health" style="color: #fde047; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.7rem; border-radius: 4px; display: flex; align-items: center; gap: 0.35rem;">
            <span>🛡️</span> Giám sát
          </a>
          <a *ngIf="authService.hasPermission('backups.write')" routerLink="/admin/backups" style="color: #fde047; text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 0.4rem 0.7rem; border-radius: 4px; display: flex; align-items: center; gap: 0.35rem;">
            <span>💾</span> Sao lưu
          </a>
          <a routerLink="/profile" style="color: white; text-decoration: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; display: flex; align-items: center; gap: 0.4rem;">
            <span>👤</span> Hồ sơ
          </a>
          <app-notification-bell></app-notification-bell>
          <button (click)="logout()" style="background: rgba(255,255,255,0.2); color: white; border: none; font-weight: 500; font-size: 0.9rem; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer;">
            Đăng xuất
          </button>
        </ng-container>
      </nav>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; box-sizing: border-box;">
    <div *ngIf="rateLimitNotice.notice() as msg"
         data-testid="rate-limit-banner"
         role="alert"
         style="background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;">
      <span>⚠️ {{ msg }}</span>
      <button type="button" (click)="rateLimitNotice.clear()" style="background: transparent; border: none; color: #991b1b; font-weight: 700; cursor: pointer;">✕</button>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
