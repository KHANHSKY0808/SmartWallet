  notificationservice:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Services/NotificationService
        ASSEMBLY_NAME: NotificationService
        PORT: 8010
    ports:
      - "8010:8010"
    environment:
      <<: *common-env
      ConnectionStrings__DefaultConnection: Data Source=/data/notification.db;Cache=Shared
      Consul__ServiceHost: notificationservice
      Consul__ServicePort: "8010"
      Smtp__Host: ${SMTP_HOST:-mailhog}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__From: ${SMTP_FROM:-no-reply@smartwallet.local}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
    volumes:
      - notification_data:/data
      - qlct_backups:/backups
    depends_on:
      rabbitmq: { condition: service_healthy }
      mailhog: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - smartwallet-net

  auditservice:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Services/AuditService
        ASSEMBLY_NAME: AuditService
        PORT: 8011
    ports:
      - "8011:8011"
    environment:
      <<: *common-env
      ConnectionStrings__DefaultConnection: Data Source=/data/audit.db;Cache=Shared
      Consul__ServiceHost: auditservice
      Consul__ServicePort: "8011"
    volumes:
      - audit_data:/data
      - qlct_backups:/backups
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8011/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - smartwallet-net

  fileservice:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Services/FileService
        ASSEMBLY_NAME: FileService
        PORT: 8012
    ports:
      - "8012:8012"
    environment:
      <<: *common-env
      ConnectionStrings__DefaultConnection: Data Source=/data/file.db;Cache=Shared
      Consul__ServiceHost: fileservice
      Consul__ServicePort: "8012"
    volumes:
      - file_data:/data
      - qlct_backups:/backups
    depends_on:
      rabbitmq: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8012/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - smartwallet-net

  apigateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      ReverseProxy__Clusters__identity-cluster__Destinations__d1__Address: http://identityservice:8001
      ReverseProxy__Clusters__profile-cluster__Destinations__d1__Address: http://userprofileservice:8002
      ReverseProxy__Clusters__wallet-cluster__Destinations__d1__Address: http://walletservice:8003
      ReverseProxy__Clusters__transaction-cluster__Destinations__d1__Address: http://transactionservice:8004
      ReverseProxy__Clusters__category-cluster__Destinations__d1__Address: http://categoryservice:8005
      ReverseProxy__Clusters__budget-cluster__Destinations__d1__Address: http://budgetservice:8006
      ReverseProxy__Clusters__saving-cluster__Destinations__d1__Address: http://savinggoalservice:8007
      ReverseProxy__Clusters__recurring-cluster__Destinations__d1__Address: http://recurringdebtservice:8008
      ReverseProxy__Clusters__debt-cluster__Destinations__d1__Address: http://recurringdebtservice:8008
      ReverseProxy__Clusters__report-cluster__Destinations__d1__Address: http://reportservice:8009
      ReverseProxy__Clusters__notification-cluster__Destinations__d1__Address: http://notificationservice:8010
      ReverseProxy__Clusters__audit-cluster__Destinations__d1__Address: http://auditservice:8011
      ReverseProxy__Clusters__file-cluster__Destinations__d1__Address: http://fileservice:8012
    volumes:
      - qlct_backups:/backups
    depends_on:
      redis: { condition: service_healthy }
      identityservice: { condition: service_healthy }
      userprofileservice: { condition: service_healthy }
      walletservice: { condition: service_healthy }
      transactionservice: { condition: service_healthy }
      categoryservice: { condition: service_healthy }
      budgetservice: { condition: service_healthy }
      savinggoalservice: { condition: service_healthy }
      recurringdebtservice: { condition: service_healthy }
      reportservice: { condition: service_healthy }
      notificationservice: { condition: service_healthy }
      auditservice: { condition: service_healthy }
      fileservice: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - smartwallet-net

  fe:
    build:
      context: .
      dockerfile: fe/Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      apigateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smartwallet-net

networks:
  smartwallet-net:
    driver: bridge

volumes:
  identity_data:
  profile_data:
  wallet_data:
  transaction_data:
  category_data:
  budget_data:
  saving_data:
  recdebt_data:
  report_data:
  notification_data:
  audit_data:
  file_data:
  qlct_backups:

