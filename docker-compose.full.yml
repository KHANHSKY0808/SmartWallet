  reportservice:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/Services/ReportService
        ASSEMBLY_NAME: ReportService
        PORT: 8009
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
      ConnectionStrings__DefaultConnection: Data Source=/data/report.db;Cache=Shared
      Consul__ServiceHost: reportservice
      Consul__ServicePort: "8009"
      Services__UserProfileService__Url: http://userprofileservice:8002
      Services__BudgetService__Url: http://budgetservice:8006
      Services__CategoryService__Url: http://categoryservice:8005
      Services__WalletService__Url: http://walletservice:8003
      Services__TransactionService__Url: http://transactionservice:8004
      Export__StoragePath: /tmp/smartwallet-exports
    volumes:
      - report_data:/data
      - qlct_backups:/backups
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
